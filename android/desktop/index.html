<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanFrame · TV recording preview</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050607;color:#e9edef;font:14px system-ui,sans-serif}header{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 22px;z-index:2;background:#121619}header strong{font-size:15px}header span{opacity:.55;font-size:12px}header button[aria-pressed="true"]{background:#4a606b;border-color:#b8d2de}header{gap:10px}header button{background:#242c31;color:inherit;border:1px solid #465057;padding:8px 13px;border-radius:10px;cursor:pointer}.spacer{flex:1}#screen{position:absolute;width:1920px;height:1080px;transform-origin:0 0;background:#000;overflow:hidden}iframe{display:block;width:1920px;height:1080px;border:0;background:#000}footer{position:fixed;bottom:0;left:0;right:0;height:38px;display:flex;align-items:center;justify-content:center;color:#8b969d;font-size:12px}.clean header,.clean footer{display:none}button:focus-visible{outline:2px solid #c5dceb;outline-offset:3px}
</style></head><body><header><strong>CleanFrame / TV preview</strong><span>Spotify placement · sample track</span><button data-music="left" aria-pressed="true">1 · Lower left</button><button data-music="center" aria-pressed="false">2 · Above dock</button><button data-music="weather" aria-pressed="false">3 · Below weather</button><button data-music="off" aria-pressed="false">Off</button><div class="spacer"></div><button id="reset">Reset TV look</button><button id="hide">Hide controls (H)</button><button id="full">Fullscreen (F)</button></header><div id="screen"><iframe id="tv" src="/tv/" title="CleanFrame TV preview" allow="autoplay; fullscreen"></iframe></div><footer>Arrow keys = remote · Enter = OK · Escape / Backspace = Back · H = clean view · F = fullscreen · Record only the 16:9 TV frame</footer><script>
(function(){var clean=false,screen=document.getElementById('screen'),tv=document.getElementById('tv');function fit(){var top=clean?0:56,bottom=clean?0:38,s=Math.min(innerWidth/1920,(innerHeight-top-bottom)/1080);screen.style.transform='scale('+s+')';screen.style.left=((innerWidth-1920*s)/2)+'px';screen.style.top=(top+(innerHeight-top-bottom-1080*s)/2)+'px';}function focus(){tv.contentWindow.focus();}function hide(){clean=!clean;document.body.classList.toggle('clean',clean);fit();focus();}function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){});focus();}document.getElementById('hide').onclick=hide;document.getElementById('full').onclick=full;document.getElementById('reset').onclick=function(){['cleanframe.home.v1','cleanframe.android.dock.v1','cleanframe.desktop.live'].forEach(function(k){localStorage.removeItem(k);});tv.contentWindow.location.reload();};addEventListener('resize',fit);document.addEventListener('fullscreenchange',function(){clean=!!document.fullscreenElement;document.body.classList.toggle('clean',clean);fit();});function key(k){if(k==='h')hide();if(k==='f')full();}addEventListener('keydown',function(e){key(e.key.toLowerCase());});addEventListener('message',function(e){if(e.origin===location.origin&&e.source===tv.contentWindow&&e.data&&e.data.cleanframeKey)key(e.data.cleanframeKey);});document.querySelectorAll('[data-music]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-music]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});tv.contentWindow.postMessage({musicPlacement:b.getAttribute('data-music')},location.origin);focus();};});tv.onload=focus;fit();}());
</script></body></html>
